name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar sitio
        run: |
          sudo apt-get install -y librsvg2-bin
          mkdir _site
          cp index.html sw.js manifest.webmanifest icon.svg _site/
          rsvg-convert -w 192 -h 192 icon.svg -o _site/icon-192.png
          rsvg-convert -w 512 -h 512 icon.svg -o _site/icon-512.png
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
